<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS11 – Exam Prep</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1b1f2a;--mut:#667;--pri:#3b6cf6;--ok:#1f9d55;--bad:#d64545;--bd:#dde1ea}
:root[data-theme=dark]{--bg:#12151c;--card:#1c212c;--tx:#e8ebf2;--mut:#98a0b3;--pri:#6b93ff;--ok:#3ccf7a;--bad:#ff6b6b;--bd:#2d3444}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{margin:0;font-size:1.6rem}.sub{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
button,input,select{font:inherit;color:inherit}
button{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.ch{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.ch .t{flex:2;min-width:180px}.ch .b{display:flex;gap:6px}
.pill{font-size:.75rem;color:var(--mut)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.opt.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset}
.opt.right{border-color:var(--ok);background:rgba(31,157,85,.15)}.opt.wrong{border-color:var(--bad);background:rgba(214,69,69,.15)}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pri)}
.exp{margin-top:8px;padding:10px;border-radius:10px;background:var(--bg);font-size:.92rem}
.msg{color:var(--bad);font-size:.9rem;margin-top:6px}
ul.n{padding-left:18px;margin:6px 0}.big{font-size:2.4rem;font-weight:700;text-align:center}
.ok{color:var(--ok)}.bad{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <header><div><h1 id="title">CS11</h1><div class="sub" id="sub"></div></div><button class="ghost" id="theme">🌙</button></header>
  <main id="app"></main>
</div>
<script src="cs11.js"></script>
<script>
const B = window.BOOK, app = document.getElementById('app'), KEY = 'cs11-progress';
document.getElementById('title').textContent = B.title;
document.getElementById('sub').textContent = B.subtitle;
// ---------- theme ----------
const root = document.documentElement, tb = document.getElementById('theme');
function setTheme(t){ root.dataset.theme = t; tb.textContent = t === 'dark' ? '☀️' : '🌙'; try{localStorage.setItem('cs11-theme', t)}catch(e){} }
let saved = null; try{ saved = localStorage.getItem('cs11-theme') }catch(e){}
setTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
tb.onclick = () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
// ---------- storage ----------
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {} }catch(e){ return {} } }
function save(p){ try{ localStorage.setItem(KEY, JSON.stringify(p)) }catch(e){} }
// ---------- helpers ----------
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const settings = { count: '10', timer: 'off' };
let Q = null, timerId = null;
function pool(nums){ const out = []; B.chapters.filter(c => nums.includes(c.n)).forEach(c => c.qs.forEach(q => out.push({ ch: c.n, q: q[0], o: q[1], a: q[2], e: q[3] }))); return out }
function build(nums){
  let items = shuffle(pool(nums));
  if(settings.count !== 'all') items = items.slice(0, +settings.count);
  return items.map(it => { const idx = shuffle([0,1,2,3]); return { ch: it.ch, q: it.q, e: it.e, o: idx.map(i => it.o[i]), a: idx.indexOf(it.a), pick: null } });
}
// ---------- home ----------
function home(){
  clearInterval(timerId);
  const p = load();
  let weak = null, low = 101;
  B.chapters.forEach(c => { const s = p[c.n]; if(s && s.last < low){ low = s.last; weak = c } });
  app.innerHTML = `
  <div class="card"><b>Mix test</b><div class="pill">Type chapter numbers separated by commas, e.g. 1,3,6</div>
    <div class="row" style="margin-top:8px"><input id="mix" placeholder="1,3,5" inputmode="numeric"><button id="go" style="flex:0 0 auto">Start</button></div>
    <div class="msg" id="err"></div></div>
  <div class="card"><div class="row">
    <label>Questions<select id="cnt"><option>10</option><option>20</option><option value="all">All</option></select></label>
    <label>Timer<select id="tim"><option value="off">Off</option><option value="1">1 min / question</option><option value="0.5">30 sec / question</option></select></label></div></div>
  ${weak && low < 70 ? `<div class="card pill">Needs work: <b>Chapter ${weak.n} – ${esc(weak.title)}</b> (last score ${low}%)</div>` : ''}
  ${B.chapters.map(c => { const s = p[c.n]; return `<div class="card ch"><div class="t"><b>${c.n}. ${esc(c.title)}</b><div class="pill">${c.qs.length} questions${s ? ` · best ${s.best}% · ${s.tries} attempt${s.tries>1?'s':''}` : ''}</div></div>
    <div class="b"><button class="sec" data-p="${c.n}">Prepare</button><button data-t="${c.n}">Test</button></div></div>` }).join('')}`;
  cnt.value = settings.count; tim.value = settings.timer;
  cnt.onchange = () => settings.count = cnt.value; tim.onchange = () => settings.timer = tim.value;
  app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => prepare(+b.dataset.p));
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => start([+b.dataset.t], 'test'));
  go.onclick = () => {
    const nums = [...new Set(mix.value.split(/[ ,]+/).filter(Boolean).map(Number))];
    const valid = B.chapters.map(c => c.n);
    if(!nums.length || nums.some(n => !valid.includes(n))){ err.textContent = 'Enter valid chapter numbers (1 to ' + valid.length + '), e.g. 1,3,6'; return }
    start(nums, 'test');
  };
}
// ---------- prepare ----------
function prepare(n){
  const c = B.chapters.find(c => c.n === n);
  app.innerHTML = `<button class="ghost" id="back">← Back</button>
  <div class="card" style="margin-top:12px"><h2 style="margin-top:0">${c.n}. ${esc(c.title)}</h2><b>Key points</b><ul class="n">${c.notes.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
  <button id="pr" style="width:100%">Practice (instant feedback)</button>`;
  back.onclick = home; pr.onclick = () => start([n], 'practice');
}
// ---------- quiz ----------
function start(nums, mode){
  const items = build(nums);
  Q = { items, i: 0, mode, nums, left: 0 };
  if(mode === 'test' && settings.timer !== 'off') Q.left = Math.round(items.length * 60 * +settings.timer);
  show();
  if(Q.left){ timerId = setInterval(() => { Q.left--; const t = document.getElementById('tm'); if(t) t.textContent = fmt(Q.left); if(Q.left <= 0) finish() }, 1000) }
}
const fmt = s => Math.floor(s/60) + ':' + String(s%60).padStart(2, '0');
function show(){
  const it = Q.items[Q.i], n = Q.items.length, practice = Q.mode === 'practice', answered = it.pick !== null;
  app.innerHTML = `<div class="row" style="flex-wrap:nowrap"><span class="pill">${practice ? 'Practice' : 'Test'} · Q ${Q.i+1}/${n}</span>${Q.left ? `<span class="pill" style="text-align:right">⏱ <b id="tm">${fmt(Q.left)}</b></span>` : ''}</div>
  <div class="bar"><i style="width:${(Q.i)/n*100}%"></i></div>
  <div class="card"><div class="pill">Chapter ${it.ch}</div><h3 style="margin:6px 0">${esc(it.q)}</h3>
  ${it.o.map((o, k) => { let cls = 'opt'; if(practice && answered){ if(k === it.a) cls += ' right'; else if(k === it.pick) cls += ' wrong' } else if(k === it.pick) cls += ' sel'; return `<button class="${cls}" data-k="${k}">${'ABCD'[k]}. ${esc(o)}</button>` }).join('')}
  ${practice && answered ? `<div class="exp">${it.pick === it.a ? '✅ Correct. ' : '❌ Incorrect. '}${esc(it.e)}</div>` : ''}</div>
  <div class="row"><button class="ghost" id="quit">Quit</button><button id="nx" ${answered ? '' : 'disabled style="opacity:.5"'}>${Q.i === n-1 ? 'Finish' : 'Next'}</button></div>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => { if(practice && answered) return; it.pick = +b.dataset.k; show() });
  quit.onclick = () => { clearInterval(timerId); home() };
  nx.onclick = () => { if(!answered) return; if(Q.i === n-1) finish(); else { Q.i++; show() } };
}
// ---------- results ----------
function finish(){
  clearInterval(timerId);
  const items = Q.items, right = items.filter(x => x.pick === x.a).length, pct = Math.round(right / items.length * 100);
  const p = load(), per = {};
  items.forEach(x => { per[x.ch] = per[x.ch] || [0, 0]; per[x.ch][1]++; if(x.pick === x.a) per[x.ch][0]++ });
  Object.keys(per).forEach(ch => { const v = Math.round(per[ch][0] / per[ch][1] * 100), s = p[ch] || { best: 0, tries: 0, last: 0 }; s.best = Math.max(s.best, v); s.tries++; s.last = v; p[ch] = s });
  save(p);
  const wrong = items.filter(x => x.pick !== x.a);
  app.innerHTML = `<div class="card"><div class="big ${pct >= 70 ? 'ok' : 'bad'}">${pct}%</div><div style="text-align:center">${right} of ${items.length} correct</div>
  <div style="margin-top:10px">${Object.keys(per).map(ch => `<div class="pill">Chapter ${ch}: ${per[ch][0]}/${per[ch][1]}</div>`).join('')}</div></div>
  <div class="row" style="margin-bottom:12px"><button class="ghost" id="hm">Home</button><button id="again">New attempt</button></div>
  <h3>${wrong.length ? 'Review wrong answers' : 'Perfect score! 🎉'}</h3>
  ${wrong.map(x => `<div class="card"><div class="pill">Chapter ${x.ch}</div><b>${esc(x.q)}</b>
    <div class="bad">Your answer: ${x.pick === null ? 'Not answered' : esc(x.o[x.pick])}</div><div class="ok">Correct: ${esc(x.o[x.a])}</div><div class="exp">${esc(x.e)}</div></div>`).join('')}`;
  hm.onclick = home; again.onclick = () => start(Q.nums, Q.mode);
}
home();
</script>
</body>
</html>
